<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16131a"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}html,body{margin:0;height:100%}body{font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Maranzetor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Rubik:wght@400;500;700&family=VT323&display=swap">
<style>
/* Layout: full-height game column; pixel city canvas with HTML HUD, touch controls, sheets and a phone overlay. Single dark world by choice. */
:root{
  --page:#16131a;--ink:#f3eee6;--muted:#9d95a6;--gold:#e9b949;--cyan:#56d4ff;--red:#ff5a5f;--ok:#6fdc8c;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.13);--panel:#1d1824;
  --lcd:#b3c58a;--lcd-dark:#28331d;--lcd-mid:#7e9160;--shell:#2d3640;
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-lcd:'VT323','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-block:10px}
.frame{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;background:#0b0a0e;border:1px solid #2c2535}

/* start */
.start{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,#3a2a4a 0%,#16131a 70%);padding:26px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.start h1{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,14vw,66px);line-height:.86;margin:8px 0 0;letter-spacing:-.02em}
.start h1 span{color:var(--gold);font-style:italic}
.start p.lead{color:var(--muted);margin:0;line-height:1.5;max-width:36ch}
.era-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.era-card{border:2px solid var(--glass2);background:var(--glass);border-radius:18px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.era-card img{height:110px;width:auto;align-self:center;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.era-card b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.era-card small{color:var(--muted);line-height:1.35}
.era-card[aria-pressed="true"]{border-color:var(--gold);background:rgba(233,185,73,.12)}
.era-card.e97 b{font-family:var(--f-lcd);font-size:38px;color:var(--lcd)}
.field label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--glass);border:2px solid var(--glass2);border-radius:14px;padding:12px 14px;color:var(--ink);font:500 17px var(--f-body)}
.btn-main{background:var(--gold);color:#1b1408;border:0;border-radius:14px;padding:15px;font:800 18px var(--f-display);letter-spacing:.02em}
.btn-ghost{background:transparent;border:2px solid var(--glass2);border-radius:14px;padding:12px;font-weight:500}
.help{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.credits{font-size:12px;color:var(--muted);line-height:1.5;margin-top:auto}

/* game */
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;padding:10px 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hud .box{background:rgba(12,10,16,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--glass2);border-radius:14px;padding:7px 10px}
.clock{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font:500 11px var(--f-body);color:var(--muted);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.wk{font-size:11px;color:var(--muted);margin-top:3px}
.mini{display:grid;grid-template-columns:auto 52px;gap:3px 6px;align-items:center;font-size:10px;color:var(--muted);margin-top:6px}
.mini i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.mini i b{display:block;height:100%;background:var(--gold)}
.mini i.low b{background:var(--red)}
.cash{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.cash small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.era97 .hud .box{background:rgba(179,197,138,.92);color:var(--lcd-dark);border-color:var(--lcd-dark);border-radius:4px;font-family:var(--f-lcd)}
.era97 .clock,.era97 .cash{font-family:var(--f-lcd);font-weight:400;font-size:26px}
.era97 .clock small,.era97 .wk,.era97 .mini,.era97 .cash small{color:var(--lcd-dark);font-family:var(--f-lcd);font-size:15px}
.era97 .mini i{background:var(--lcd-mid);border-radius:0}
.era97 .mini i b{background:var(--lcd-dark)}
.prompt{position:absolute;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(12,10,16,.8);border:1px solid var(--gold);color:var(--ink);padding:7px 12px;border-radius:99px;font-size:13px;white-space:nowrap;pointer-events:none}
.prompt b{color:var(--gold)}
.toasts{position:absolute;left:0;right:0;top:96px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 10px}
.toast{background:rgba(12,10,16,.86);border:1px solid var(--glass2);border-radius:12px;padding:7px 12px;font-size:13px;max-width:100%;animation:toast 3.2s forwards}
.toast .up{color:var(--ok)}.toast .down{color:var(--red)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}

/* controls */
.controls{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.joy{width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);position:relative;pointer-events:auto;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5)}
.btns{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;pointer-events:auto;align-items:end}
.rb{border:0;border-radius:50%;display:grid;place-items:center;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.4);touch-action:manipulation}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.rb.a{width:70px;height:70px;background:var(--gold);color:#1b1408;font:800 26px var(--f-display);grid-row:1/3;grid-column:2}
.rb.s{width:50px;height:50px;background:#2f2a38;color:var(--ink);font-size:20px;position:relative}
.rb.s.on{background:var(--cyan);color:#062230}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 11px var(--f-body);display:grid;place-items:center;padding:0 4px}
@media (hover:hover) and (pointer:fine){.joy{display:none}}

/* sheets */
.sheet-wrap{position:absolute;inset:0;background:rgba(5,4,8,.55);display:flex;align-items:flex-end;animation:fade .2s;z-index:5}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--glass2);border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.sheet p{margin:0;line-height:1.5}
.sheet .sub{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--cyan);color:#06222c;flex:none}
.who b{display:block}.who small{color:var(--muted)}
.bubble{background:var(--glass2);border-radius:4px 18px 18px 18px;padding:12px 14px;line-height:1.5;font-size:15.5px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--glass);border:1px solid var(--glass2);border-radius:14px;padding:13px 14px;text-align:left;font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choice em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.choice:active{background:var(--glass2)}
.choice[disabled]{opacity:.4}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx span{font-size:13px;font-weight:500;padding:4px 9px;border-radius:9px;font-variant-numeric:tabular-nums}
.fx .up{background:rgba(111,220,140,.15);color:var(--ok)}
.fx .down{background:rgba(255,90,95,.15);color:var(--red)}
.gauge{position:relative;height:46px;border-radius:12px;background:#2a2433;overflow:hidden;border:1px solid var(--glass2)}
.gauge .zone{position:absolute;top:0;bottom:0;background:rgba(111,220,140,.35);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--gold);border-radius:2px;box-shadow:0 0 12px var(--gold)}
.rpm{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.era97 .sheet{background:var(--lcd);color:var(--lcd-dark);font-family:var(--f-lcd);font-size:21px;border-radius:6px 6px 0 0;border-top:4px solid var(--lcd-dark)}
.era97 .sheet h3{font-family:var(--f-lcd);font-weight:400;font-size:28px}
.era97 .sheet .sub,.era97 .who small{color:var(--lcd-dark);opacity:.75}
.era97 .av{background:var(--lcd-dark);color:var(--lcd);border-radius:0}
.era97 .bubble{background:rgba(40,51,29,.12);border-radius:0;font-size:21px}
.era97 .choice{background:none;border:2px solid var(--lcd-dark);border-radius:0;font-size:20px}
.era97 .choice:hover,.era97 .choice:focus-visible{background:var(--lcd-dark);color:var(--lcd)}
.era97 .choice em{color:inherit;font-size:18px}
.era97 .fx span{background:var(--lcd-dark);color:var(--lcd);border-radius:0;font-size:17px;font-weight:400}
.era97 .btn-main{background:var(--lcd-dark);color:var(--lcd);border-radius:0;font:400 24px var(--f-lcd)}
.era97 .btn-ghost{border-color:var(--lcd-dark);border-radius:0;font:400 20px var(--f-lcd)}
.era97 .gauge{background:var(--lcd-mid);border:2px solid var(--lcd-dark);border-radius:0}
.era97 .gauge .zone{background:var(--lcd);border-color:var(--lcd-dark)}
.era97 .gauge .needle{background:var(--lcd-dark);box-shadow:none}
.era97 .rpm{color:var(--lcd-dark);font-size:16px}

/* phone overlay */
.phov{position:absolute;inset:0;background:rgba(5,4,8,.6);display:flex;align-items:center;justify-content:center;z-index:6;animation:fade .15s;padding:14px}
.ph26{width:100%;max-width:340px;height:min(600px,100%);background:linear-gradient(170deg,#241b30,#0e0c12);border:2px solid #3a3146;border-radius:36px;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
.ph26 .pst{display:flex;justify-content:space-between;padding:12px 22px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.ph26 .pbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
.ph26 .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--glass2);padding:8px 6px 12px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.tab span{font-size:19px}
.tab[aria-selected="true"]{color:var(--gold)}
.tab .badge{right:16%;top:-6px}
.ph97{width:100%;max-width:300px;height:min(580px,100%);background:var(--shell);border:1px solid #3d4855;border-radius:40px 40px 60px 60px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:10px;animation:up .22s ease-out}
.ph97 .brand{text-align:center;font:700 11px var(--f-body);letter-spacing:.35em;color:#9fb0c2}
.ph97 .lcd{flex:1;min-height:0;background:var(--lcd);color:var(--lcd-dark);border-radius:12px;font-family:var(--f-lcd);font-size:20px;line-height:1.05;padding:9px 11px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;box-shadow:inset 0 3px 10px rgba(0,0,0,.35)}
.ph97 .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ph97 .key{background:#43505e;border:0;border-radius:14px;color:#dfe7ef;font:700 11px var(--f-body);letter-spacing:.04em;padding:10px 2px;box-shadow:0 3px 0 #1c232b;position:relative}
.ph97 .key[aria-selected="true"]{background:#7d8fa3}
.ph97 .key .badge{top:-6px;right:-2px}
.ph97 .closek{background:#5a6878;border:0;border-radius:20px 20px 26px 26px;color:#dfe7ef;font:700 12px var(--f-body);padding:11px;box-shadow:0 3px 0 #1c232b}
.pcard{background:var(--glass);border:1px solid var(--glass2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ph97 .pcard{background:none;border:0;border-top:2px solid var(--lcd-dark);border-radius:0;padding:5px 0 0}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stat .top b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.low i{background:var(--red)}
.ph97 .stat .top,.ph97 .stat .top b{color:var(--lcd-dark);font-size:18px}
.ph97 .bar{background:var(--lcd-mid);border-radius:0;height:8px}
.ph97 .bar i{background:var(--lcd-dark)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--glass2)}
.ph97 .chip{background:var(--lcd-dark);color:var(--lcd);border-radius:0;font-size:16px;padding:0 5px}
.msg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--glass2)}
.msg small{color:var(--muted)}
.msg button{align-self:flex-start;background:var(--gold);color:#1b1408;border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.ph97 .msg{background:none;border:0;border-bottom:2px dashed var(--lcd-dark);border-radius:0;padding:4px 0 6px}
.ph97 .msg small{color:var(--lcd-dark);opacity:.75}
.ph97 .msg button{background:var(--lcd-dark);color:var(--lcd);border-radius:0;font:400 19px var(--f-lcd);padding:1px 8px}
.ph97 p,.ph26 p{margin:0;line-height:1.4}
.minimap{width:100%;height:auto;image-rendering:pixelated;border-radius:10px;border:1px solid var(--glass2);aspect-ratio:384/212}
.ph97 .minimap{border-radius:0;border:2px solid var(--lcd-dark);filter:grayscale(1) sepia(.5) hue-rotate(40deg) contrast(1.1)}
.legend{font-size:12px;color:var(--muted);line-height:1.5}
.ph97 .legend{color:var(--lcd-dark);font-size:16px}
.ph26 .btn-main{font-size:16px;padding:12px}
.ph97 .btn-main,.ph97 .btn-ghost{background:var(--lcd-dark);color:var(--lcd);border:0;border-radius:0;font:400 21px var(--f-lcd);padding:4px 8px}

.ending{position:absolute;inset:0;z-index:7;background:radial-gradient(120% 70% at 50% 0%,#3a2a4a 0%,#16131a 70%);padding:26px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.ending .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ending h2{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:.95;margin:0;color:var(--gold);text-wrap:balance}
.ending p{line-height:1.55;margin:0}

[hidden]{display:none!important}
.interior{margin:-6px -6px 0;border-radius:16px;overflow:hidden;background:radial-gradient(90% 90% at 50% 60%,rgba(233,185,73,.16),rgba(255,255,255,.02));display:grid;place-items:center;flex:none}
.interior img{max-height:200px;width:auto;max-width:100%}
.era97 .interior{border-radius:0;background:rgba(40,51,29,.1)}
.mg{gap:10px}.mgc{width:100%;height:230px;border-radius:14px;background:#120e18;display:block;touch-action:none}.mgc.tall{height:300px}.mgc.snake{background:#b3c58a;border-radius:6px}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lane{height:62px;border-radius:14px;border:0;background:var(--glass2);font-size:24px;touch-action:manipulation}.lane:active{background:var(--gold);color:#1b1408}
.btn-main.big{font-size:24px;padding:20px;touch-action:manipulation}
.hearts{font-size:20px;color:#ff3d7f;display:flex;gap:6px;align-items:center}.hearts span{font:700 14px var(--f-body);color:var(--ink);margin-right:6px}.hearts b{color:var(--muted);font-weight:400}
.tbar{height:8px;border-radius:8px;background:var(--glass2);overflow:hidden}.tbar i{display:block;height:100%;background:var(--gold);width:100%}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad button{height:56px;border:0;border-radius:12px;background:#43505e;color:#dfe7ef;font-size:22px;touch-action:manipulation}
.era97 .mgc{background:#1d2516}.era97 .lane{background:var(--lcd-mid);border-radius:0;color:var(--lcd-dark)}.era97 .tbar{background:var(--lcd-mid);border-radius:0}.era97 .tbar i{background:var(--lcd-dark)}.era97 .hearts span{color:var(--lcd-dark);font-family:var(--f-lcd)}
.endimg{width:100%;max-width:420px;align-self:center;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (orientation:landscape) and (max-height:560px){.interior img{max-height:110px}.mgc{height:42vh}.mgc.tall{height:46vh}.lane{height:46px}.pad button{height:40px}.endimg{max-width:240px}}
.tut{align-items:stretch;text-align:left}
.tutart{height:150px;display:grid;place-items:center;border-radius:18px;background:radial-gradient(80% 90% at 50% 70%,rgba(233,185,73,.22),rgba(255,255,255,.03));flex:none}
.tutart img{max-height:136px;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.tutart span{font-size:72px;line-height:1}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--glass2)}.dots i.on{background:var(--gold);width:20px;border-radius:4px}
.tutbtns{display:flex;gap:10px}.tutbtns>*{flex:1}
.era97 .tutart{background:rgba(40,51,29,.12);border-radius:0}.era97 .dots i{background:var(--lcd-mid);border-radius:0}.era97 .dots i.on{background:var(--lcd-dark)}
.installwrap{z-index:9}
.inst ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.instic img{width:76px;height:76px;border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
@media (orientation:landscape) and (max-height:560px){.tutart{height:96px}.tutart img{max-height:88px}.tutart span{font-size:48px}.instic img{width:52px;height:52px}}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;padding-block:4px}
  .frame{border-radius:14px}
  .hud{padding:6px 8px 0}.hud .box{padding:5px 8px;border-radius:10px}
  .clock{font-size:17px}.wk{font-size:10px;margin-top:2px}
  .mini{grid-template-columns:auto 44px auto 44px;margin-top:4px;gap:2px 5px}
  .cash{font-size:15px}
  .toasts{top:62px}
  .controls{padding:0 12px calc(8px + env(safe-area-inset-bottom,0px))}

function isSolid(u,v){if(u<.6||v<.6||u>N-.6||v>N-.6)return true;return SOL[Math.floor(v)][Math.floor(u)]}
function buildGround(){
  ground=document.createElement('canvas');ground.width=N*2*HW;ground.height=N*2*HH;
  const c=ground.getContext('2d'),U=256,pat={};
  c.fillStyle="#3b6a2c";c.fillRect(0,0,ground.width,ground.height);
  for(const k of['grass','asphalt','side','piazza'])pat[k]=IMG['tex_'+k]?c.createPattern(IMG['tex_'+k],'repeat'):'#777';
  c.setTransform(HW/U,HH/U,-HW/U,HH/U,OX,0);
  const map={g:'grass',q:'grass',r:'asphalt',s:'side',p:'piazza'};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){c.fillStyle=pat[map[T[y][x]]];c.fillRect(x*U-1,y*U-1,U+2,U+2)}
  // pitch tint + lines
  c.fillStyle="rgba(40,120,40,.25)";c.fillRect(23*U,23*U,6*U,6*U);
  c.strokeStyle="rgba(255,255,255,.85)";c.lineWidth=U*.05;c.strokeRect(23.3*U,23.3*U,5.4*U,5.4*U);
  c.beginPath();c.moveTo(26*U,23.3*U);c.lineTo(26*U,28.7*U);c.stroke();c.beginPath();c.arc(26*U,26*U,U*.8,0,7);c.stroke();
  // curbs
  c.fillStyle="rgba(0,0,0,.35)";
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(T[y][x]!=='r')continue;
    if(T[y-1]&&T[y-1][x]==='s')c.fillRect(x*U,y*U,U,U*.06);
    if(T[y+1]&&T[y+1][x]==='s')c.fillRect(x*U,(y+1)*U-U*.06,U,U*.06);
    if(T[y][x-1]==='s')c.fillRect(x*U,y*U,U*.06,U);
    if(T[y][x+1]==='s')c.fillRect((x+1)*U-U*.06,y*U,U*.06,U)}
  // lane dashes
  c.fillStyle="rgba(240,234,210,.9)";
  for(const v of[10,21])for(let x=0;x<N;x++){if([9,10,20,21].includes(x))continue;c.fillRect(x*U+U*.2,v*U-U*.035,U*.6,U*.07)}
  for(const u of[10,21])for(let y=0;y<N;y++){if([9,10,20,21].includes(y))continue;c.fillRect(u*U-U*.035,y*U+U*.2,U*.07,U*.6)}
  // zebra crossings
  c.fillStyle="rgba(245,245,240,.92)";
  for(const x of[8,11,19,22])for(const y of[9,10,20,21])for(let k=0;k<4;k++)c.fillRect(x*U+U*.12,y*U+k*U*.25+U*.05,U*.76,U*.13);
  for(const y of[8,11,19,22])for(const x of[9,10,20,21])for(let k=0;k<4;k++)c.fillRect(x*U+k*U*.25+U*.05,y*U+U*.12,U*.13,U*.76);
  // contact shadows
  c.fillStyle="rgba(0,0,0,.28)";BLD.forEach(b=>c.fillRect((b.x-.05)*U,(b.y-.05)*U,(b.w+.35)*U,(b.h+.35)*U));
  c.setTransform(1,0,0,1,0,0);
}

  const out=[];

    if('tipa' in set){S.tipa=set.tipa===true?ERA[S.era].names.tipa:set.tipa;if(S.tipa){unlock('cuore');relAdd('tipa',20)}}

let gaugeRAF=0;
function startTune(){const cost=TUNE_COST[S.mezzo];S.soldi-=cost;S.day.tuned=true;
  const w=Math.max(10,26-S.mezzo*6),z=rnd(10,90-w);

function runGauge(){cancelAnimationFrame(gaugeRAF);const step=()=>{if(!sheet||sheet.kind!=='tune'||sheet.done)return;
  sheet.pos+=sheet.dir*sheet.speed;if(sheet.pos>=100){sheet.pos=100;sheet.dir=-1}if(sheet.pos<=0){sheet.pos=0;sheet.dir=1}
  const n=document.querySelector('.needle');if(n)n.style.left=sheet.pos+'%';const r=$('rpm');if(r)r.textContent=Math.round(2000+sheet.pos*100)+' giri';
  gaugeRAF=requestAnimationFrame(step)};gaugeRAF=requestAnimationFrame(step)}
function hitTune(){if(!sheet||sheet.kind!=='tune'||sheet.done)return;sheet.done=true;cancelAnimationFrame(gaugeRAF);
  const[a,b]=sheet.zone,ok=sheet.pos>=a&&sheet.pos<=b;let out,text;
  if(ok){S.mezzo++;if(S.mezzo>=3)unlock('mezzo');out=applyFx({figo:6+S.mezzo*2,risp:4});out.unshift(['mezzo',1]);text=`Perfetto. Ora hai: ${ERA[S.era].mezzi[S.mezzo]}. Premi il tasto del mezzo per salirci.`}

function newCar(d,lane,pos,sg=1){return{d,lane,s:sg,p:pos-4,sp:2.1+Math.random()*.8,img:Math.floor(Math.random()*4),stop:0,honk:0}}
function carUV(c){return c.d==='x'?[c.p,c.lane]:[c.lane,c.p]}
function updateLife(dt){
  CARS.forEach(c=>{
    const[cu,cv]=carUV(c);
    let block=false;
    const pu=player.u,pv=player.v;
    const sg=c.s||1,ahead=(c.d==='x'?pu-cu:pv-cv)*sg,side=c.d==='x'?Math.abs(pv-cv):Math.abs(pu-cu);
    if(ahead>0&&ahead<1.6&&side<.75)block=true;
    for(const o of CARS){if(o===c||o.d!==c.d||o.lane!==c.lane)continue;const g=(o.p-c.p)*sg;if(g>0&&g<2.4)block=true}
    for(const n of NPCS){if(!n.vis)continue;const a=(c.d==='x'?n.u-cu:n.v-cv)*sg,s=c.d==='x'?Math.abs(n.v-cv):Math.abs(n.u-cu);if(a>0&&a<1.3&&s<.6)block=true}
    if(block){c.stop+=dt;if(c.stop>1.2&&c.honk<=0&&ahead>0&&ahead<1.6&&side<.75){c.honk=6;AUD.sfx('honk');c.say={t:pick(["Pista!","Oh, ti sposti?","BEEP BEEP!","Ma dove vai?"]),until:performance.now()+1800}}}
    else{c.stop=0;c.p+=c.sp*dt*sg}
    c.honk-=dt;
    if(sg>0&&c.p>N+3||sg<0&&c.p<-3){c.p=sg>0?-3-Math.random()*6:N+3+Math.random()*6;c.img=Math.floor(Math.random()*4);c.sp=2.1+Math.random()*.8}
  });

  CATS.forEach(k=>{k.t-=dt;if(k.t<=0){const r=Math.random();if(r<.35){k.st=3;k.t=6+Math.random()*8}else if(r<.7){k.st=0;k.t=3+Math.random()*4}else{k.st=1;k.t=2.5;k.tu=k.hu+(Math.random()-.5)*2;k.tv=k.hv+(Math.random()-.5)*1.2}}

    if(Math.hypot(k.u-player.u,k.v-player.v)<.9&&k.st===3){k.st=0;k.t=2}});
  PIGS.forEach(p=>{const d=Math.hypot(p.u-player.u,p.v-player.v);

}

function mgEnd(title,text,fx,set,mins){cancelAnimationFrame(MG&&MG.raf);const cb=MG&&MG.after;MG=null;let out=applyFx(fx||{},set);{const pos=Object.values(fx||{}).some(v=>v>0);emote(pos?'happy':'angry');if(!pos)camShake(5)}if(mins)advance(mins);AUD.sfx(Object.values(fx||{}).some(v=>v>0)?'good':'bad');log(text);sheet={kind:'result',title,text,fx:out,next:cb||'close'};AUD.street();renderLayer()}
function mgHtml(){const t=sheet.type,M=MGS[t];return`<div class="sheet-wrap"><div class="sheet mg" role="dialog" aria-label="${esc(M.title)}"><h3>${esc(M.title)}</h3><p class="sub" id="mgsub">${esc(M.help)}</p>${M.html()}<button class="btn-ghost" data-do="mgquit">Lascia perdere</button></div></div>`}
function mgCanvas(){const c=$('mgc');if(!c)return null;const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{c,x,W:r.width,H:r.height}}
const MGS={
 dance:{title:"In pista!",help:"Tocca la corsia giusta quando la freccia arriva sulla linea.",
  html:()=>`<canvas id="mgc" class="mgc tall"></canvas><div class="lanes">${['◀','▼','▲','▶'].map((a,i)=>`<button class="lane" data-lane="${i}">${a}</button>`).join('')}</div>`,
  start(){const C=mgCanvas();if(!C)return;const bpm=129.25,bt=60/bpm,off=.395,start=34;
    const song=AUD.play('mirco-e-gabbah-fest-v2',{start,loop:false,vol:.55});const t0=performance.now();
    const clock=()=>{const a=song&&!song.paused&&song.currentTime>start-.5?song.currentTime:start+(performance.now()-t0)/1000;return a};
    const first=Math.ceil((start+1.8-off)/bt);const notes=[];for(let k=first;k<first+40;k++){const t=off+k*bt;if(Math.random()<.78)notes.push({t,l:Math.floor(Math.random()*4),h:0});if(k%4===3&&Math.random()<.4)notes.push({t:t+bt/2,l:Math.floor(Math.random()*4),h:0})}
    const end=notes[notes.length-1].t+1;let score=0,hits=0,combo=0,best=0,flash=[0,0,0,0],msg='',msgT=0;
    const hit=l=>{const now=clock();let bn=null,bd=.17;for(const n of notes){if(n.h||n.l!==l)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;bn=n}}flash[l]=1;
      if(bn){bn.h=1;hits++;combo++;best=Math.max(best,combo);const p=bd<.07;score+=p?100:60;msg=p?'PERFETTO!':'BENE';msgT=.5;AUD.sfx('tap')}else{combo=0;msg='FUORI TEMPO';msgT=.4}};
    MG.hit=hit;document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.lane)}));
    const lw=C.W/4,hy=C.H-40,spd=C.H*.9,cols=['#ff3d7f','#56d4ff','#6fdc8c','#e9b949'],ar=['◀','▼','▲','▶'];
    const frame=()=>{const now=clock(),x=C.x;x.clearRect(0,0,C.W,C.H);
      const beat=((now-off)/bt)%1;x.fillStyle=`rgba(255,61,127,${.08+.1*(1-beat)})`;x.fillRect(0,0,C.W,C.H);
      for(let i=0;i<4;i++){x.fillStyle=`rgba(255,255,255,${.04+flash[i]*.25})`;x.fillRect(i*lw+3,0,lw-6,C.H);flash[i]*=.85}
      x.strokeStyle="rgba(255,255,255,.7)";x.lineWidth=3;x.beginPath();x.moveTo(0,hy);x.lineTo(C.W,hy);x.stroke();
      x.textAlign='center';x.textBaseline='middle';x.font=`800 ${lw*.42}px Rubik, sans-serif`;
      for(const n of notes){if(n.h)continue;const y=hy-(n.t-now)*spd;if(y<-30||y>C.H+30)continue;if(n.t<now-.2){n.h=-1;combo=0}x.fillStyle=cols[n.l];x.beginPath();x.roundRect(n.l*lw+lw*.18,y-lw*.3,lw*.64,lw*.6,10);x.fill();x.fillStyle="#140f1e";x.fillText(ar[n.l],n.l*lw+lw/2,y+1)}
      x.fillStyle="#fff";x.font=`800 18px Rubik, sans-serif`;x.textAlign='left';x.fillText(score+' pt',10,20);x.textAlign='right';x.fillText('combo '+combo,C.W-10,20);
      if(msgT>0){msgT-=1/60;x.textAlign='center';x.font=`800 26px "Bricolage Grotesque", sans-serif`;x.fillStyle="#e9b949";x.fillText(msg,C.W/2,C.H*.4)}
      if(now>end){const acc=hits/notes.length;AUD.stop();
        if(acc>.75){unlock('pista');mission('win');mgEnd("In pista!",`Re della pista: ${Math.round(acc*100)}% a tempo, combo da ${best}. Tutti ti guardano.`,{figo:6,risp:2,soldi:-5})}
        else if(acc>.45)mgEnd("In pista!",`Te la sei cavata: ${Math.round(acc*100)}% a tempo.`,{figo:3,risp:1,soldi:-5});
        else mgEnd("In pista!",`Sembravi una sedia a sdraio che si apre: ${Math.round(acc*100)}% a tempo. Qualcuno ha filmato.`,{figo:-4,soldi:-5});return}
      MG.raf=requestAnimationFrame(frame)};frame();
    MG.key=k=>{const m={arrowleft:0,a:0,arrowdown:1,s:1,arrowup:2,w:2,arrowright:3,d:3}[k];if(m!=null)hit(m)}}},
 rimorchio:{title:"Rimorchio",help:"Scegli la risposta giusta prima che finisca il tempo.",
  html:()=>`<div class="hearts" id="hearts"></div><div class="bubble" id="rq"></div><div class="tbar"><i id="rt"></i></div><div class="choices" id="ropts"></div>`,
  start(){const is97=S.era==='97',name=ERA[S.era].names.tipa;
    const R=is97?[
      ["Ciao... ti ho visto in piazza col motorino.",["«Ti piace? Te lo faccio provare quando vuoi.»","«Sì, è truccato, va a 80 all'ora.»","«Eh.»"]],
      ["Che musica ascolti?",["«Un po' di tutto, ti faccio una cassetta?»","«Solo quella che va in disco.»","«Mia madre ascolta Baglioni.»"]],
      ["Sabato cosa fai?",["«Se vieni tu, vengo anche io.»","«Vado in disco, poi vediamo.»","«Studio. Forse.»"]],
      ["Ti hanno detto che sei un po' tamarro?",["«Solo chi è invidioso del bomber.»","«Tamarro a chi?»","«...»"]]]
     :[
      ["Ciao! Ti seguo su TikTok, fai video divertenti.",["«Il prossimo lo facciamo insieme?»","«Lo so, sto per diventare virale.»","«Ok.»"]],
      ["Che musica ascolti?",["«Ti mando una playlist che ho fatto io.»","«Solo trap, il resto è cringe.»","«Quella di mio padre in macchina.»"]],
      ["Sabato cosa fai?",["«Se vieni tu, Club Nova.»","«Vediamo, ho tanti inviti.»","«Fortnite tutta la notte.»"]],
      ["Perché hai sempre il borsello?",["«Ci tengo dentro le cose importanti. Tipo il tuo numero, se me lo dai.»","«Perché è firmato.»","«Non lo so.»"]]];
    const rounds=R.sort(()=>Math.random()-.5).slice(0,3);let ri=0,hearts=1,tm=0,lim=4.5;
    const draw=()=>{$('hearts').innerHTML='<span>'+name+'</span> '+'❤'.repeat(Math.max(0,hearts))+'<b>'+'♡'.repeat(Math.max(0,5-hearts))+'</b>'};
    const ask=()=>{if(ri>=rounds.length){const ok=hearts>=4;if(ok)mgEnd(name,`${name} ride e ti dà il numero. Siete usciti insieme e ora state insieme. ❤`,{figo:10},{tipa:true});else mgEnd(name,hearts>=2?`${name} è simpatica, ma per ora resta un'amica.`:`${name} ti saluta con la mano e se ne va con le amiche. Ridono.`,hearts>=2?{figo:1}:{figo:-5});return}
      const[q,a]=rounds[ri];const sc=[2,1,-1],idx=[0,1,2].sort(()=>Math.random()-.5);$('rq').textContent=q;
      $('ropts').innerHTML=idx.map(i=>`<button class="choice" data-r="${i}"><span>${esc(a[i])}</span></button>`).join('');
      document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{hearts+=sc[+b.dataset.r];AUD.sfx(sc[+b.dataset.r]>0?'good':'bad');ri++;tm=0;draw();ask()});tm=0};
    draw();ask();let last=performance.now();
    const loop=t=>{const dt=(t-last)/1000;last=t;tm+=dt;const e=$('rt');if(!e)return;e.style.width=Math.max(0,100-tm/lim*100)+'%';if(tm>lim){hearts-=1;ri++;AUD.sfx('bad');draw();ask()}if(MG)MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}},
 braccio:{title:"Braccio di ferro",help:"Picchietta il tasto più veloce che puoi!",
  html:()=>`<canvas id="mgc" class="mgc"></canvas><button class="btn-main big" id="mash">SPINGI!</button>`,
  start(){const C=mgCanvas();if(!C)return;let p=0,t=0,last=performance.now();const k=.22+(100-S.risp)/400;
    const push=()=>{p=Math.min(1,p+.09);AUD.sfx('tap')};$('mash').addEventListener('pointerdown',e=>{e.preventDefault();push()});MG.key=k2=>{if(k2===' '||k2==='e'||k2==='enter')push()};
    const P=IMG[CHARS[S.era].p[playerTier()]+'_w00'],O=IMG[CHARS[S.era].compa+'_w00'];
    const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;p-=k*dt*(1+t*.08);const x=C.x;x.clearRect(0,0,C.W,C.H);
      const cx=C.W/2+p*C.W*.32;
      if(P){const h=C.H*.85,w=P.width*h/P.height;x.save();x.translate(C.W*.16+w/2,0);x.scale(-1,1);x.drawImage(P,-w/2,C.H-h,w,h);x.restore()}
      if(O){const h=C.H*.88,w=O.width*h/O.height;x.drawImage(O,C.W*.84-w/2,C.H-h,w,h)}
      x.fillStyle="rgba(255,255,255,.12)";x.fillRect(C.W*.1,C.H*.5,C.W*.8,10);x.fillStyle=p>0?"#6fdc8c":"#ff5a5f";x.fillRect(C.W/2,C.H*.5,p*C.W*.4,10);
      x.font=`${C.H*.25}px sans-serif`;x.textAlign='center';x.fillText('✊',cx,C.H*.45);
      if(p>=1||p<=-1||t>8){const win=p>=1||(t>8&&p>0);if(win){unlock('braccio');relAdd('bulli',6);mission('win')}mgEnd("Braccio di ferro",win?"Vinto! Il Guercio si massaggia il polso e ti chiama capo.":"Perso. Polso piegato davanti a tutti, e offri tu il giro.",win?{risp:12}:{risp:-6,soldi:-6});return}
      MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}},
 rigori:{title:"Rigori al campetto",help:"Tocca una volta per mirare, una seconda volta per la potenza.",
  html:()=>`<canvas id="mgc" class="mgc"></canvas><button class="btn-main big" id="kick">TIRA!</button>`,
  start(){const C=mgCanvas();if(!C)return;let n=0,goals=0,ph='aim',a=0,ad=1,pw=0,pd=1,res=null,resT=0,ball=null;
    const tap=()=>{if(ph==='aim'){ph='pow'}else if(ph==='pow'){ph='shot';AUD.sfx('kick');const keeper=Math.floor(Math.random()*3),zone=a<.33?0:a<.66?1:2;const over=pw>.92,weak=pw<.3;
        const g=!over&&zone!==keeper&&!(weak&&Math.random()<.6);ball={t:0,a,keeper,g,over};res=null}};
    $('kick').addEventListener('pointerdown',e=>{e.preventDefault();tap()});MG.key=k=>{if(k===' '||k==='e'||k==='enter')tap()};
    let last=performance.now();
    const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const x=C.x,W=C.W,H=C.H;x.clearRect(0,0,W,H);
      x.fillStyle="#3f8f3f";x.fillRect(0,H*.55,W,H*.45);const gx=W*.15,gw=W*.7,gy=H*.12,gh=H*.42;
      x.strokeStyle="#fff";x.lineWidth=5;x.strokeRect(gx,gy,gw,gh);x.strokeStyle="rgba(255,255,255,.25)";x.lineWidth=1;for(let i=1;i<10;i++){x.beginPath();x.moveTo(gx+gw*i/10,gy);x.lineTo(gx+gw*i/10,gy+gh);x.stroke()}
      if(ph==='aim'){a+=ad*dt*.9;if(a>1||a<0){ad*=-1;a=Math.max(0,Math.min(1,a))}}
      if(ph==='pow'){pw+=pd*dt*1.2;if(pw>1||pw<0){pd*=-1;pw=Math.max(0,Math.min(1,pw))}}
      let kx=gx+gw/2;if(ball){ball.t+=dt*1.6;kx=gx+gw*(ball.keeper/2*0.8+.1+(.5-(ball.keeper/2*0.8+.1))*(1-Math.min(1,ball.t*2)))}
      const K=IMG[CHARS[S.era].bulli+"_w00"];if(K){const kh=gh*.82,kw=K.width*kh/K.height,lean=ball?(ball.keeper-1)*Math.min(1,ball.t*2)*.6:0;x.save();x.translate(kx,gy+gh);x.rotate(lean);x.drawImage(K,-kw/2,-kh,kw,kh);x.restore()}
      const tx=gx+gw*(ph==='aim'?a:(ball?ball.a:a));x.strokeStyle="#ff3d7f";x.lineWidth=3;x.beginPath();x.arc(tx,gy+gh*.5,14,0,7);x.stroke();
      x.fillStyle="rgba(255,255,255,.15)";x.fillRect(W*.1,H-26,W*.8,12);x.fillStyle=pw>.92?"#ff5a5f":pw<.3?"#9d95a6":"#6fdc8c";x.fillRect(W*.1,H-26,W*.8*pw,12);
      if(ball){const k=Math.min(1,ball.t);const bx=W/2+(tx-W/2)*k,by=H*.9+(gy+gh*(ball.over?-.2:.5)-H*.9)*k;x.fillStyle="#fff";x.beginPath();x.arc(bx,by,10-4*k,0,7);x.fill();
        if(ball.t>1.15){n++;if(ball.g)goals++;res=ball.g?'GOL!':ball.over?'ALTA!':'PARATA!';resT=1;AUD.sfx(ball.g?'good':'bad');ball=null;ph=n>=5?'end':'aim';pw=0}}
      else{x.fillStyle="#fff";x.beginPath();x.arc(W/2,H*.9,10,0,7);x.fill()}
      x.font=`800 18px Rubik, sans-serif`;x.textAlign='left';x.fillStyle="#fff";x.fillText(`Gol ${goals}/${n}`,10,22);
      if(res&&resT>0){resT-=dt;x.textAlign='center';x.font=`800 34px "Bricolage Grotesque", sans-serif`;x.fillStyle="#e9b949";x.fillText(res,W/2,H*.7)}
      if(ph==='end'&&resT<=0){if(goals>=4)unlock('bomber');mgEnd("Rigori",`${goals} gol su 5.`+(goals>=4?" Ti chiamano già il bomber del quartiere.":goals>=2?" Partita dignitosa.":" Il portiere ride ancora."),goals>=4?{risp:8,figo:3,fam:-1}:goals>=2?{risp:3,fam:-1}:{risp:-3,fam:-1},null,60);return}
      MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}},
 snake:{title:"Snake",help:"Frecce o tasti per girare. Non morderti la coda.",
  html:()=>`<canvas id="mgc" class="mgc snake"></canvas><div class="pad"><button data-sd="0">▲</button><button data-sd="3">◀</button><button data-sd="2">▼</button><button data-sd="1">▶</button></div>`,
  start(){const C=mgCanvas();if(!C)return;const GW=20,GH=13,cs=Math.floor(Math.min(C.W/GW,C.H/GH)),ox=(C.W-cs*GW)/2,oy=(C.H-cs*GH)/2;
    let sn=[[6,6],[5,6],[4,6]],dir=1,nd=1,food=[12,6],sc=0,acc=0,step=.16;const D=[[0,-1],[1,0],[0,1],[-1,0]];
    const turn=d=>{if((d+2)%4!==dir)nd=d};document.querySelectorAll('[data-sd]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(+b.dataset.sd)}));
    MG.key=k=>{const m={arrowup:0,w:0,arrowright:1,d:1,arrowdown:2,s:2,arrowleft:3,a:3}[k];if(m!=null)turn(m)};
    let sx0=null;$('mgc').addEventListener('pointerdown',e=>{sx0=[e.clientX,e.clientY]});$('mgc').addEventListener('pointerup',e=>{if(!sx0)return;const dx=e.clientX-sx0[0],dy=e.clientY-sx0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));sx0=null});
    const place=()=>{do{food=[Math.floor(Math.random()*GW),Math.floor(Math.random()*GH)]}while(sn.some(s=>s[0]===food[0]&&s[1]===food[1]))};
    let last=performance.now();const L='#b3c58a',Dk='#28331d';
    const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;const x=C.x;
      if(acc>step){acc=0;dir=nd;const h=[sn[0][0]+D[dir][0],sn[0][1]+D[dir][1]];
        if(h[0]<0||h[1]<0||h[0]>=GW||h[1]>=GH||sn.some(s=>s[0]===h[0]&&s[1]===h[1])){AUD.sfx('bad');if(sc>=20)unlock('snake');let rec=0;try{rec=+localStorage.getItem('mz-snake')||0;if(sc>rec)localStorage.setItem('mz-snake',sc)}catch(e){}
          const bonus=Math.min(3,Math.floor(sc/5)),can=(S.flags.snakeW!==S.week);const fx=can&&bonus?{figo:bonus}:{};if(can&&bonus)S.flags.snakeW=S.week;
          mgEnd("Snake",`Game over: ${sc} punti.`+(sc>rec?` Nuovo record! (prima: ${rec})`:` Record: ${Math.max(rec,sc)}.`)+(fx.figo?" In classe ne parlano tutti.":""),fx);return}
        sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){sc++;AUD.sfx('tap');place();step=Math.max(.07,step-.004)}else sn.pop()}
      x.fillStyle=L;x.fillRect(0,0,C.W,C.H);x.strokeStyle=Dk;x.lineWidth=2;x.strokeRect(ox-2,oy-2,cs*GW+4,cs*GH+4);x.fillStyle=Dk;
      sn.forEach(s=>x.fillRect(ox+s[0]*cs+1,oy+s[1]*cs+1,cs-2,cs-2));x.fillRect(ox+food[0]*cs+cs*.25,oy+food[1]*cs+cs*.25,cs*.5,cs*.5);
      x.font=`20px VT323, monospace`;x.textAlign='right';x.fillText(String(sc).padStart(4,'0'),C.W-6,16);
      MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}}
};

const WEATHER={sole:{i:'☀️'},nuvole:{i:'☁️'},freddo:{i:'🧣'},
  caldo:{i:'🌞',note:"Fa caldo: si vive in maglietta e ghiacciolo."},
  pioggia:{i:'🌧️',note:"Settimana di pioggia: ombrelli rotti e scarpe fradice."},
  neve:{i:'❄️',note:"È nevicato! Il quartiere è tutto bianco."}};
function pickWeather(d){const m=d.getMonth(),r=Math.random();
  if(m===11||m===0||m===1)return r<.45?'neve':r<.75?'freddo':'nuvole';
  if(m===4||m===5)return r<.6?'caldo':r<.85?'sole':'pioggia';
  if(m===8)return r<.7?'sole':'caldo';
  return r<.38?'pioggia':r<.65?'nuvole':'sole'}
const isXmas=()=>dateOf(S.week).getMonth()===11;
const XCOL=['255,60,70','80,220,120','255,210,80','90,170,255'];
function xmasBulbs(fn){LAMPS.forEach(([x,y],li)=>{const[wx,wy]=iso(x+.5,y+.5);for(let k=0;k<7;k++)fn(wx+Math.sin(k*1.9)*9,wy-128+k*15,(k+li)%4)});
  if(S.zone!==1){const[fx,fy]=iso(15,15);for(let k=0;k<16;k++){const a=k/16*Math.PI*2;fn(fx+Math.cos(a)*96,fy-6+Math.sin(a)*48,k%4)}}}
function drawSeason(t){const w=S.day.w;
  if(isXmas()){const on=Math.floor(t*2);xmasBulbs((x,y,c)=>{const lit=(c+on)%4!==0;ctx.fillStyle=lit?`rgb(${XCOL[c]})`:'rgba(60,60,60,.8)';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()})}
  ctx.setTransform(1,0,0,1,0,0);
  const tint={neve:'rgba(225,235,255,.2)',pioggia:'rgba(50,70,100,.2)',caldo:'rgba(255,190,90,.09)',freddo:'rgba(170,190,225,.08)'}[w];
  if(tint){ctx.fillStyle=tint;ctx.fillRect(0,0,cv.width,cv.height)}}
function seasonGlow(glow,a,t){if(!isXmas())return;const on=Math.floor(t*2);xmasBulbs((x,y,c)=>{if((c+on)%4)glow(x,y,26,XCOL[c],a*.9)})}
const frac=x=>x-Math.floor(x);
function drawWeather(t){const w=S.day.w,W=cv.width,H=cv.height,d=DPR;
  if(w==='neve'){ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<110;i++){const sp=30+frac(i*.37)*50,x=frac(i*.6180339)*W+Math.sin(t*.9+i)*18*d,y=frac(frac(i*.7548)+t*sp*d/H)*H,r=(1.2+frac(i*.913)*2.4)*d;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}
  if(w==='pioggia'){ctx.strokeStyle='rgba(190,210,240,.45)';ctx.lineWidth=1.3*d;ctx.beginPath();for(let i=0;i<140;i++){const x=frac(i*.6180339)*W*1.1,y=frac(frac(i*.7548)+t*(1.4+frac(i*.37)*.6))*H,l=(14+frac(i*.29)*10)*d;ctx.moveTo(x,y);ctx.lineTo(x-l*.25,y+l)}ctx.stroke()}
  if(w==='caldo'){const g=ctx.createLinearGradient(0,0,0,H*.4);g.addColorStop(0,'rgba(255,220,140,.18)');g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.4)}
}

  html:()=>`<canvas id="mgc" class="mgc"></canvas><button class="btn-main big" id="shift">CAMBIA!</button>`,
  start(){const C=mgCanvas();if(!C)return;
    let gear=1,rpm=0,pos=0,rpos=0,rv=0,cd=3,state='count',msg='',mt=0,last=performance.now(),boost=0,lim=0;
    const pw=1+S.mezzo*.1,rmax=.19+Math.random()*.025,G=[.55,.38,.28,.2],B=[.105,.16,.215,.27];
    const shift=()=>{if(state!=='race'||gear>=4)return;const ok=rpm>=.74&&rpm<=.92;msg=ok?'PERFETTO!':rpm<.74?'TROPPO PRESTO':'TARDI!';mt=.7;
      if(ok)boost=.6;gear++;rpm=ok?.42:.28;AUD.sfx(ok?'good':'tap')};

        let v=B[gear-1]*(.4+Math.min(rpm,1)*.6)*pw;if(lim>0&&gear<4)v*=.55;if(boost>0){boost-=dt;v*=1.12}
        if(gear===4)rpm=Math.min(rpm,.93);
        pos+=v*dt;rv=Math.min(rmax,rv+.085*dt);rpos+=rv*dt;
        if(pos>=1||rpos>=1){state='end';const win=pos>=rpos;
          setTimeout(()=>{if(win){unlock('gara');relAdd('bulli',8);mission('win')}mgEnd("Gara alla rotonda",win?`Vinto di ${Math.max(1,Math.round((pos-rpos)*40))} metri. Il campetto ora è anche tuo.`:"Ti hanno staccato sul rettilineo. E paghi tu.",win?{risp:12,figo:4}:{risp:-6,soldi:-10})},700)}}

      const lane=(p,yc,lab,hue)=>{const vx=14+p*(fx-90),vh=th*.42;if(pv){const s=vh/pv.height;x.save();if(hue)x.filter='hue-rotate(160deg) saturate(1.4)';x.drawImage(pv,vx,yc-vh/2,pv.width*s,vh);x.restore()}
        x.fillStyle='#fff';x.font='700 12px Rubik, sans-serif';x.textAlign='left';x.fillText(lab,vx+4,yc-vh/2-4)};
      lane(rpos,ty+th*.25,bully,1);lane(pos,ty+th*.75,'TU',0);
      // gauge
      const gx=W/2,gy=H*.98,R=Math.min(W*.3,H*.32);
      x.lineWidth=14;x.strokeStyle='rgba(255,255,255,.15)';x.beginPath();x.arc(gx,gy,R,Math.PI,0);x.stroke();
      x.strokeStyle='#6fdc8c';x.beginPath();x.arc(gx,gy,R,Math.PI+.74*Math.PI,Math.PI+.92*Math.PI);x.stroke();
      x.strokeStyle='#ff5a5f';x.beginPath();x.arc(gx,gy,R,Math.PI+.94*Math.PI,2*Math.PI);x.stroke();
      const a=Math.PI+Math.min(rpm,1)*Math.PI;x.strokeStyle='#e9b949';x.lineWidth=4;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+Math.cos(a)*R*.95,gy+Math.sin(a)*R*.95);x.stroke();
      x.fillStyle='#fff';x.textAlign='center';x.font='800 22px Rubik, sans-serif';x.fillText(`${gear}ª`,gx,gy-R*.3);
      if(state==='count'){x.font='800 54px "Bricolage Grotesque", sans-serif';x.fillStyle='#e9b949';x.fillText(Math.ceil(cd),W/2,ty+th/2+18)}
      if(mt>0){mt-=dt;x.font='800 26px "Bricolage Grotesque", sans-serif';x.fillStyle='#e9b949';x.fillText(msg,W/2,ty+th+30)}
      if(MG)MG.raf=requestAnimationFrame(loop)};
    MG.raf=requestAnimationFrame(loop)}};

function tileType1(x,y){
  const R=[9,10,20,21],SW=[8,11,19,22];
  if(R.includes(x)||R.includes(y))return'r';
  if(SW.includes(x)||SW.includes(y))return's';
  if(inB(x,y,12,12,18,18))return(x===15||y===15)?'s':'g';
  if(inB(x,y,12,23,18,28))return'p';
  if(inB(x,y,23,23,28,28))return'q';
  return'g';
}

function emote(k,dur=1.6){player.emoQ={k,dur}}

function emoTransform(c,sx,sy){const e=player.emo;if(!e)return;const t=performance.now()/1000-e.t0;

  if(e.k==='dance'){const a=Math.sin(t*8)*.12;c.translate(sx,sy);c.rotate(a);c.translate(-sx,-sy);c.translate(0,-Math.abs(Math.sin(t*8))*8)}}
function emoOverlay(c,sx,sy,top){const e=player.emo;if(!e&&!phoneOpen)return;const t=e?performance.now()/1000-e.t0:0;
  const k=phoneOpen?'phone':e.k,ic={happy:'😄',angry:'💢',dance:'🎵',wave:'👋',phone:'📱',love:'💗'}[k];if(!ic)return;
  const a=phoneOpen?1:Math.min(1,(e.dur-t)*3),yy=top-14-Math.min(1,t*4)*8;c.save();c.globalAlpha=Math.max(0,a);
  c.fillStyle='#fff';c.beginPath();c.arc(sx+26,yy,17,0,7);c.fill();c.font='20px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ic,sx+26,yy+1);c.restore()}

const AMB={nodes:null,bellDone:{},next:0};
function ambInit(){const c=AUD.ctx;if(!c||AMB.nodes)return;const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;
  const mk=(type,f,q)=>{const s=c.createBufferSource();s.buffer=b;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();return{g,fl}};
  AMB.nodes={rain:mk('highpass',1800),chat:mk('bandpass',700,1.2),wind:mk('lowpass',400)}}
function ambUpdate(dt){const c=AUD.ctx;if(!c)return;ambInit();if(!AMB.nodes)return;const on=AUD.sOn&&!document.hidden?1:0,now=c.currentTime,h=S.min/60;
  const set=(n,v)=>AMB.nodes[n].g.gain.setTargetAtTime(v*on,now,.4);
  set('rain',S.day.w==='pioggia'?.05:0);set('wind',S.day.w==='neve'||S.day.w==='freddo'?.03:.008);
  const bar=BLD.find(b=>b.id==='bar'||b.id==='pizzeria'||b.id==='centro'),db=bar?Math.hypot(player.u-bar.door[0],player.v-bar.door[1]):99;
  const ch=db<5&&h>=8&&h<23?(1-db/5)*.045*(.6+.4*Math.sin(now*3.1)*Math.sin(now*1.7)):0;set('chat',ch);
  if(S.zone!==1){for(const bh of[8.9,13.5]){const key=S.week+'_'+bh;if(h>=bh&&h<bh+.3&&!AMB.bellDone[key]){AMB.bellDone[key]=1;const sc=BLD.find(b=>b.id==='scuola'),d=sc?Math.hypot(player.u-sc.door[0],player.v-sc.door[1]):20,v=Math.max(.02,.12-d*.006);for(let i=0;i<6;i++)AUD.tone(i%2?1046:1318,.18,'square',v,0,i*.2)}}}
  AMB.next-=dt;if(AMB.next<=0){AMB.next=2+Math.random()*5;
    if(h>=6&&h<19&&S.day.w!=='pioggia'&&AUD.sOn){const f=2400+Math.random()*1600;for(let i=0;i<3;i++)AUD.tone(f*(1+i*.08),.07,'sine',.018,1.3,i*.09)}
    if((h>=21||h<5)&&(S.day.w==='caldo'||S.day.w==='sole')&&AUD.sOn)for(let i=0;i<4;i++)AUD.tone(4200,.03,'square',.008,1,i*.06)}}

MGS.brick={title:"Cabinato: Mattoncini",help:"Muovi la barra trascinando il dito (o con le frecce). Rompi più mattoncini che puoi in 60 secondi: 3 vite.",
  html:()=>`<canvas id="mgc" class="mgc tall"></canvas>`,
  start(){const C=mgCanvas();if(!C)return;const W=C.W,H=C.H,cols=8,rows=5,bw=(W-20)/cols,bh=16;let px=W/2,pw=W*.22,bx=W/2,by=H-60,vx=150,vy=-260,lives=3,score=0,t=60,last=performance.now(),stuck=true,over=false;
    const br=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)br.push({x:10+c*bw,y:40+r*(bh+6),a:1,col:['#ff3d7f','#ff9f43','#e9b949','#6fdc8c','#56d4ff'][r]});
    C.c.addEventListener('pointermove',e=>{const r=C.c.getBoundingClientRect();px=e.clientX-r.left});C.c.addEventListener('pointerdown',e=>{const r=C.c.getBoundingClientRect();px=e.clientX-r.left;stuck=false});
    MG.key=k=>{if(k===' '||k==='enter')stuck=false};
    const end=()=>{over=true;const n=score;if(n>=30)unlock('arcade');const win=n>=15;if(win)mission('win');setTimeout(()=>mgEnd("Cabinato",n>=40?`${n} mattoncini! Il tuo nome in cima alla classifica della sala.`:n>=15?`${n} mattoncini. Qualcuno dietro di te fa "uuuh".`:`Solo ${n} mattoncini. I gettoni finiscono in fretta.`,win?{figo:n>=40?5:3,risp:n>=40?3:1}:{figo:-1}),400)};
    const loop=now=>{const dt=Math.min(.033,(now-last)/1000);last=now;const x=C.x;if(!over){t-=dt;
      if(keys['arrowleft']||keys['a'])px-=420*dt;if(keys['arrowright']||keys['d'])px+=420*dt;if(keys['arrowleft']||keys['arrowright']||keys['a']||keys['d'])stuck=false;
      px=Math.max(pw/2,Math.min(W-pw/2,px));
      if(stuck){bx=px;by=H-48}else{bx+=vx*dt;by+=vy*dt;
        if(bx<6||bx>W-6){vx=-vx;bx=Math.max(6,Math.min(W-6,bx))}if(by<6){vy=Math.abs(vy)}
        if(by>H-44&&by<H-30&&Math.abs(bx-px)<pw/2+6&&vy>0){vy=-Math.abs(vy)*1.02;vx=(bx-px)/(pw/2)*260;AUD.sfx('tap')}
        if(by>H){lives--;stuck=true;AUD.sfx('bad');if(lives<=0)end()}
        for(const b of br){if(b.a&&bx>b.x&&bx<b.x+bw-4&&by>b.y&&by<b.y+bh){b.a=0;vy=-vy;score++;AUD.tone(600+score*12,.05,'square',.05);break}}
        if(br.every(b=>!b.a))br.forEach(b=>b.a=1)}
      if(t<=0)end()}
      x.fillStyle='#0b0b1a';x.fillRect(0,0,W,H);br.forEach(b=>{if(!b.a)return;x.fillStyle=b.col;x.fillRect(b.x,b.y,bw-4,bh);x.fillStyle='rgba(255,255,255,.3)';x.fillRect(b.x,b.y,bw-4,3)});
      x.fillStyle='#fff';x.fillRect(px-pw/2,H-40,pw,10);x.beginPath();x.arc(bx,by,6,0,7);x.fill();
      x.font='700 14px Rubik, sans-serif';x.textAlign='left';x.fillText(`PUNTI ${score}`,10,20);x.textAlign='center';x.fillText(`${Math.max(0,Math.ceil(t))}s`,W/2,20);x.textAlign='right';x.fillText('♥'.repeat(Math.max(0,lives)),W-10,20);
      if(stuck&&!over){x.textAlign='center';x.fillText('Tocca per lanciare',W/2,H/2)}
      if(MG)MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}};

MGS.tdance={title:"Dance challenge",help:"Fai la coreografia: tocca la mossa giusta quando arriva sul cerchio. Più combo fai, più follower guadagni.",
  html:()=>`<canvas id="mgc" class="mgc tall"></canvas><div class="lanes">${['👈','🙌','🕺','👉'].map((a,i)=>`<button class="lane" data-lane="${i}">${a}</button>`).join('')}</div>`,
  start(){const C=mgCanvas();if(!C)return;const bpm=129.25,bt=60/bpm,off=.395,start=96;const song=AUD.play('mirco-e-gabbah-fest-v2',{start,loop:false,vol:.5});const t0=performance.now();
    const clock=()=>song&&!song.paused&&song.currentTime>start-.5?song.currentTime:start+(performance.now()-t0)/1000;
    const first=Math.ceil((start+1.6-off)/bt),notes=[];for(let k=first;k<first+32;k++)if(k%2===0||Math.random()<.35)notes.push({t:off+k*bt,l:Math.floor(Math.random()*4),h:0});
    const endT=notes[notes.length-1].t+1;let hits=0,combo=0,best=0,msg='',msgT=0,likes=0,fl=[0,0,0,0];
    const hit=l=>{const now=clock();let bn=null,bd=.18;for(const n of notes){if(n.h||n.l!==l)continue;const d=Math.abs(n.t-now);if(d<bd){bd=d;bn=n}}fl[l]=1;
      if(bn){bn.h=1;hits++;combo++;best=Math.max(best,combo);likes+=10+combo*3;msg=bd<.07?'PERFETTO!':'OK!';msgT=.5;AUD.sfx('tap')}else{combo=0;msg='NO!';msgT=.4}};
    document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();hit(+b.dataset.lane)}));
    MG.key=k=>{const m={arrowleft:0,a:0,arrowdown:1,s:1,arrowup:2,w:2,arrowright:3,d:3}[k];if(m!=null)hit(m)};
    const ic=['👈','🙌','🕺','👉'],lw=C.W/4,hy=C.H-50;let done=false;
    const loop=()=>{const now=clock(),x=C.x;x.fillStyle='#120a1c';x.fillRect(0,0,C.W,C.H);
      const g=x.createLinearGradient(0,0,C.W,C.H);g.addColorStop(0,'rgba(255,0,80,.18)');g.addColorStop(1,'rgba(0,240,255,.18)');x.fillStyle=g;x.fillRect(0,0,C.W,C.H);
      for(let i=0;i<4;i++){x.strokeStyle=`rgba(255,255,255,${.25+fl[i]*.6})`;x.lineWidth=3;x.beginPath();x.arc(i*lw+lw/2,hy,lw*.32,0,7);x.stroke();fl[i]*=.85}
      x.textAlign='center';x.textBaseline='middle';x.font=`${lw*.42}px sans-serif`;
      for(const n of notes){if(n.h)continue;const y=hy-(n.t-now)*C.H*.8;if(y<-40||y>C.H+40)continue;x.fillText(ic[n.l],n.l*lw+lw/2,y)}
      x.font='800 15px Rubik, sans-serif';x.fillStyle='#fff';x.fillText(`❤ ${likes}   combo ${combo}`,C.W/2,22);
      if(msgT>0){msgT-=1/60;x.font='800 26px "Bricolage Grotesque", sans-serif';x.fillStyle='#e9b949';x.fillText(msg,C.W/2,C.H*.4)}
      if(now>endT&&!done){done=true;const acc=hits/notes.length;const win=acc>.6;if(win)mission('win');if(acc>.85)unlock('tiktoker');
        setTimeout(()=>mgEnd("Dance challenge",acc>.85?`Video virale: ${likes} like in un'ora!`:win?`Video carino, ${likes} like. Qualcuno l'ha già rifatto.`:"Fuori tempo. Il video resta nelle bozze.",win?{foll:Math.round(likes*1.5),figo:acc>.85?5:2}:{figo:-1}),300);return}
      if(MG)MG.raf=requestAnimationFrame(loop)};MG.raf=requestAnimationFrame(loop)}};

      ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(bx,by,w,26*Z,13*Z);ctx.fill();ctx.beginPath();ctx.moveTo(sx-6*Z,by+25*Z);ctx.lineTo(sx+6*Z,by+25*Z);ctx.lineTo(sx,by+33*Z);ctx.fill();ctx.fillStyle="#141017";ctx.fillText(n.say.t,bx+w/2,by+13.5*Z)}
